version: "3.8"

name: estoque-front

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: ["sh", "entrypoint.sh"]

  db:
    image: postgres:17-alpine
    container_name: pg_estoque
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_LOCAL_PASSWORD:-backup}
      POSTGRES_DB: estoque_backup
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.pg_backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # backup:
  #   image: postgres:16-alpine
  #   profiles: ["backup"]
